name: Thử nghiệm chiến lược

# Chạy mỗi Chủ Nhật (giờ UTC) và khi bấm tay.
on:
  schedule:
    - cron: "40 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lott-data
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m lottlab.popularity
      - run: python -m lottlab.models
      - run: python -m lottlab.study
      - run: python -m lottlab.optimize
      - run: python -m lottlab.lines
      - run: python -m lottlab backtest
      - name: Lưu thay đổi
        run: bash .github/scripts/save.sh "Cập nhật thử nghiệm chiến lược"
