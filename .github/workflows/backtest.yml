name: Thử nghiệm chiến lược

# Chạy mỗi Chủ Nhật (giờ UTC) và khi bấm tay.
on:
  schedule:
    - cron: "40 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lott-data
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m lottlab backtest
      - name: Lưu thay đổi
        run: |
          git config user.name "lott-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Cập nhật thử nghiệm chiến lược"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; sleep $((i*5)); done
          exit 1
