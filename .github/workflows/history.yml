name: Tải lịch sử kết quả

# Tải lùi các kỳ cũ, tối đa 300 trang mỗi lần (4 giây mỗi trang),
# 2 lần mỗi ngày vào giờ vắng, cho đến khi đủ lịch sử. Sau đó tự dừng (không tải gì thêm).
on:
  schedule:
    - cron: "10 16 * * *"
    - cron: "10 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lott-data
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m lottlab history 300
      - name: Lưu thay đổi
        run: bash .github/scripts/save.sh "Tải thêm lịch sử kết quả"
