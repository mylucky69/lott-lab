name: Cập nhật kết quả

# Giờ GitHub là UTC. Sydney = UTC+10 (AEST) hoặc UTC+11 (AEDT).
# 06:20–13:20 UTC = khoảng 16:20–00:20 giờ Sydney: đủ để chốt số lúc 17:00
# ngày trước kỳ quay và lấy kết quả ngay sau giờ quay (~20:30–21:00).
# 21:20 UTC = sáng hôm sau, để lấy bảng tiền thưởng công bố muộn.
on:
  schedule:
    - cron: "20 6-13 * * *"
    - cron: "20 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lott-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m lottlab update
      - name: Lưu thay đổi
        run: bash .github/scripts/save.sh "Cập nhật dữ liệu $(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M')"
