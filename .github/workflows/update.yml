name: Cập nhật kết quả

# GitHub hay trễ hoặc bỏ các lần chạy theo lịch, nên mỗi lần được chạy, quy trình tự lặp lại
# mỗi 15 phút (tối đa ~5,5 giờ) chừng nào còn việc đang chờ: kết quả đã đến giờ nhưng chưa có,
# hoặc sắp đến giờ chốt bộ số. Không còn việc thì dừng ngay.
on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lott-update        # own queue, so a long loop never blocks history/backtest runs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cập nhật (lặp lại khi còn việc đang chờ)
        run: |
          end=$((SECONDS + 5 * 3600 + 1800))
          while true; do
            python -m lottlab update
            bash .github/scripts/save.sh "Cập nhật dữ liệu $(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M')"
            python -m lottlab pending || { echo "Không còn việc đang chờ"; break; }
            if [ $SECONDS -ge $end ]; then echo "Hết thời gian, lần chạy sau sẽ tiếp tục"; break; fi
            sleep 900
            git pull -q --rebase || true
          done
