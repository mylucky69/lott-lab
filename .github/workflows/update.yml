name: Cập nhật kết quả

# GitHub hay trễ hoặc bỏ các lần chạy theo lịch khi quá tải, nên chạy mỗi 30 phút cả ngày.
# Mỗi lần chạy chỉ tải dữ liệu khi đã đến giờ có kết quả mới (vài trang mỗi kỳ quay).
on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lott-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m lottlab update
      - name: Lưu thay đổi
        run: bash .github/scripts/save.sh "Cập nhật dữ liệu $(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M')"
