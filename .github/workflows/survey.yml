name: Khảo sát nguồn dữ liệu (tạm thời)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lott-data
  cancel-in-progress: false
jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/survey.py survey
      - run: |
          git config user.name "lott-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- survey && git commit -m "Kết quả khảo sát nguồn dữ liệu" && git pull --rebase -q && git push
