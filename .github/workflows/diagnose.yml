name: Chẩn đoán nguồn dữ liệu (tạm thời)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lott-data
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Lưu trang nguồn để kiểm tra
        run: |
          mkdir -p diag
          python - <<'PY'
          from pathlib import Path
          from lottlab import sources as src
          from lottlab.games import GAMES
          out = Path("diag")
          for gid in ("powerball", "oz", "saturday"):
              g = GAMES[gid]
              for name, url in (("le", f"{src.LE_BASE}/{src.LE_SLUG[gid]}-results"),
                                ("lg", src.lg_history_url(g, 1))):
                  try:
                      page = src.polite_get(url)
                      (out / f"{name}_{gid}.html").write_text(page[:300000])
                      print(name, gid, "ok", len(page))
                  except Exception as e:
                      (out / f"{name}_{gid}.err").write_text(str(e))
                      print(name, gid, "error", e)
          PY
      - name: Lưu
        run: |
          git config user.name "lott-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag && git commit -q -m "Chẩn đoán nguồn dữ liệu" && git pull --rebase -q && git push -q
